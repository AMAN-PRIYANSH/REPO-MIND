# CP4: PostgreSQL 16 + pgvector for real runs and the pgvector contract tests (ADR-007).
# Local use only: the password is a throwaway default, the port is bound to localhost.
#   docker compose up -d pgvector
#   export VULNTRACE_PG_DSN=postgresql://postgres:postgres@localhost:5432/postgres
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
