[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulntrace"
version = "0.1.0"
description = "VulnTrace AI: Go vulnerability reachability triage"
requires-python = ">=3.11"
dependencies = ["jsonschema"]  # helper responses are validated at run time (CP2)

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
