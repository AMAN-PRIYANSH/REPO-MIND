[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulntrace"
version = "0.1.0"
description = "VulnTrace AI: Go vulnerability reachability triage"
requires-python = ">=3.11"
# jsonschema: CP2 helper responses; pyyaml: CP3 vulndb reports; numpy: CP4 vectors
dependencies = ["jsonschema", "pyyaml", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]
# CP4: PostgreSQL + pgvector vector store (tests skip without a database)
db = ["psycopg[binary]", "pgvector"]
# CP4: real embedding / reranker models, only for evaluation runs (Colab). Never installed in CI.
ml = ["sentence-transformers"]
# CP6: the LangGraph investigation agent (pinned: a release at least two weeks old when CP6 started)
agent = ["langgraph==1.2.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulntrace = ["retrieval/migrations/*.sql", "retrieval/fixed_retriever.json", "llm/prompts/*.txt", "llm/prompts/*.json",
             "agent/prompts/*.txt", "agent/prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
